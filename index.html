<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Redball3fl</title>
		
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

		<style>
			html, body {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100%;
				height: 100%;
				background-color: black;
				overflow: hidden;
				touch-action: none;
			}

			/* CAPA 1: El juego Flash de fondo siempre activo */
			#flash-container {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1;
				pointer-events: auto;
			}

			/* CAPA 2: El canvas de Godot ahora deja pasar los clics al fondo por defecto... */
			#canvas {
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 2;
				background: transparent !important;
				pointer-events: none; 
			}

			/* ...¡PERO se activa OBLIGATORIAMENTE cuando tocas la zona de tus botones! */
			#canvas.active-controls {
				pointer-events: auto !important;
			}

			#canvas:focus {
				outline: none;
			}

			#status {
				position: absolute;
				left: 0; right: 0; top: 0; bottom: 0;
				background-color: #242424;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				visibility: hidden;
				z-index: 3;
				pointer-events: none;
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Redball3fl.icon.png" />
	</head>
	<body>
		
		<div id="flash-container"></div>

		<script>
			window.RufflePlayer = window.RufflePlayer || {};
			window.addEventListener("DOMContentLoaded", () => {
				const ruffle = window.RufflePlayer.newest();
				const player = ruffle.createPlayer();
				document.getElementById("flash-container").appendChild(player);
				player.load({
					url: "redball3.swf",
					allowScriptAccess: true,
					autoplay: "on",
					unmuteOverlay: "hidden"
				});
			});
		</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="status">
			<img id="status-splash" src="Redball3fl.png" alt="">
			<progress id="status-progress"></progress>
		</div>

		<script>
			const cv = document.getElementById('canvas');
			
			// Detectamos si el usuario está tocando la parte inferior de la pantalla (donde suelen ir los controles de Red Ball 4)
			window.addEventListener('touchstart', (e) => {
				const touchY = e.touches[0].clientY;
				const screenHeight = window.innerHeight;
				
				// Si toca en el 35% inferior de la pantalla, le damos el control a Godot
				if (touchY > screenHeight * 0.65) {
					cv.classList.add('active-controls');
				} else {
					// Si toca arriba (para interactuar con menús de Flash), el control va a Ruffle
					cv.classList.remove('active-controls');
				}
			}, { passive: true });

			window.addEventListener('touchend', () => {
				// Al levantar el dedo, liberamos la capa para que Ruffle siga funcionando
				setTimeout(() => {
					cv.classList.remove('active-controls');
				}, 100);
			});
		</script>

		<script src="Redball3fl.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Redball3fl","experimentalVK":false,"fileSizes":{"Redball3fl.pck":37260,"Redball3fl.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			}
		},
	}).then(() => {
		statusOverlay.remove();
	});
}());
		</script>
	</body>
</html>
