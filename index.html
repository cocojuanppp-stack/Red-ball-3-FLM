<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Redball3fl</title>
		
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #000000;
				overflow: hidden;
				touch-action: none;
			}

			/* CAPA 1 (Fondo): El juego Flash original */
			#flash-container {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1;
			}

			/* CAPA 2 (Frente): El lienzo de Godot con los controles */
			#canvas {
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 10;
				background-color: transparent !important;
			}

			#status {
				position: absolute;
				top: 0; left: 0; right: 0; bottom: 0;
				background-color: #242424;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 100;
			}
		</style>
	</head>
	<body>
		
		<div id="flash-container"></div>

		<script>
			window.addEventListener("DOMContentLoaded", () => {
				const ruffle = window.RufflePlayer.newest();
				const player = ruffle.createPlayer();
				document.getElementById("flash-container").appendChild(player);
				player.load({ url: "redball3.swf" }); // Asegúrate de que este sea el nombre correcto de tu archivo swf
			});
		</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="status">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {
	"args":[],
	"canvasResizePolicy":2,
	"executable":"index",
	"focusCanvas":true,
	// IMPORTANTE: Habilitamos transparencia aquí
	"canvasContextAttributes": { "alpha": true }
};
const engine = new Engine(GODOT_CONFIG);

// (El resto del script de inicialización se mantiene igual al que tenías)
engine.startGame().then(() => {
    document.getElementById('status').remove();
});
		</script>
	</body>
</html>
