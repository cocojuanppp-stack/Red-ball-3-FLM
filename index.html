<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diagnóstico RedBall</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        
        /* Capa 1: Ruffle (Fondo) */
        #flash-container { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        /* Capa 2: Godot (Frente) - CON MARCO ROJO PARA VER SI APARECE */
        #canvas {
            position: absolute; width: 100%; height: 100%;
            z-index: 999;
            border: 5px solid red !important; /* MARCO DE DIAGNÓSTICO */
            pointer-events: none; /* Atraviesa los toques */
        }
    </style>
</head>
<body>
    <div id="flash-container"></div>
    <canvas id="canvas"></canvas>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("flash-container").appendChild(player);
            player.load({ url: "redball3.swf" });
        });
    </script>
    
    <script src="index.js"></script>
    <script>
        const engine = new Engine({ "canvasContextAttributes": { "alpha": true } });
        engine.startGame();
    </script>
</body>
</html>
