<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Redball3fl</title>
		
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

		<style>
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}

			body {
				color: white;
				background-color: black;
				overflow: hidden;
				touch-action: none;
			}

			/* Canvas transparente de Godot al frente para tus botones táctiles */
			#canvas {
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 2;
				background: transparent !important;
			}

			#canvas:focus {
				outline: none;
			}

			#status, #status-splash, #status-progress {
				position: absolute;
				left: 0;
				right: 0;
			}

			#status, #status-splash {
				top: 0;
				bottom: 0;
			}

			#status {
				background-color: #242424;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				visibility: hidden;
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Redball3fl.icon.png" />
	</head>
	<body>
		
		<div id="flash-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>

		<script>
			window.RufflePlayer = window.RufflePlayer || {};
			window.addEventListener("DOMContentLoaded", () => {
				const ruffle = window.RufflePlayer.newest();
				const player = ruffle.createPlayer();
				document.getElementById("flash-container").appendChild(player);
				player.load({
					url: "redball3.swf",
					allowScriptAccess: true,
					autoplay: "on",
					unmuteOverlay: "hidden"
				});
			});
		</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="Redball3fl.png" alt="">
			<progress id="status-progress"></progress>
		</div>

		<script src="Redball3fl.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Redball3fl","experimentalVK":false,"fileSizes":{"Redball3fl.pck":37260,"Redball3fl.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			}
		},
	}).then(() => {
		statusOverlay.remove();
	});
}());
		</script>
	</body>
</html>
