<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Redball3fl</title>
		<style>
			html, body {
				margin: 0; padding: 0; border: 0;
				width: 100%; height: 100%;
				background-color: black;
				overflow: hidden; touch-action: none;
			}
			/* El juego Flash al fondo */
			#flash-container {
				position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
			}
			/* El Canvas de Godot flotando arriba */
			#canvas {
				display: block;
				position: absolute; top: 0; left: 0; width: 100%; height: 100%;
				z-index: 10;
				/* ESTA ES LA CLAVE: El canvas no bloquea los clics */
				pointer-events: none;
				background-color: transparent !important;
			}
			/* Solo permitimos clics en el canvas si necesitas presionar algo */
			#canvas.active { pointer-events: auto; }
		</style>
	</head>
	<body>
		<div id="flash-container"></div>
		<canvas id="canvas"></canvas>

		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			window.addEventListener("DOMContentLoaded", () => {
				const ruffle = window.RufflePlayer.newest();
				const player = ruffle.createPlayer();
				document.getElementById("flash-container").appendChild(player);
				player.load({ url: "redball3.swf" });
			});
		</script>
		<script src="index.js"></script>
		<script>
			const GODOT_CONFIG = {
				"canvasResizePolicy":2,
				"canvasContextAttributes": { "alpha": true }
			};
			const engine = new Engine(GODOT_CONFIG);
			engine.startGame();
		</script>
	</body>
</html>
